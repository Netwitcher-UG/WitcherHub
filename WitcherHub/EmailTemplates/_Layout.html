<!doctype html>
<html lang="ar">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7fb;padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:10px;overflow:hidden;">
                    <tr>
                        <td style="padding:18px 22px;background:#111827;color:#ffffff;">
                            <div style="font-size:16px;font-weight:700;">{{AppName}}</div>
                            <div style="font-size:12px;opacity:.85;">{{BrandLine}}</div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:22px;">
                            {{{Body}}}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:14px 22px;background:#f3f4f6;color:#6b7280;font-size:12px;">
                            {{FooterText}}
                        </td>
                    </tr>
                </table>

                <div style="width:600px;color:#9ca3af;font-size:11px;margin-top:10px;">
                    {{LegalLine}}
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
