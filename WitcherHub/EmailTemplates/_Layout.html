<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{Subject}}</title>

    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">

    <style>
        /* Default: dark-safe (works best in Gmail too) */
        .legalBar {
            background: #6B4CE6 !important; /* logo purple */
            background-image: linear-gradient(#6B4CE6,#6B4CE6) !important;
        }

        .legalText {
            color: #ffffff !important;
            opacity: 1 !important;
        }

        /* Light mode: turn it yellow (clients that respect it) */
        @media (prefers-color-scheme: light) {
            .legalBar {
                background: #F7D84B !important; /* logo yellow */
                background-image: linear-gradient(#F7D84B,#F7D84B) !important;
            }

            .legalText {
                color: #111827 !important;
                opacity: .85 !important;
            }
        }

        /* Dark mode: keep purple */
        @media (prefers-color-scheme: dark) {
            .legalBar {
                background: #6B4CE6 !important;
                background-image: linear-gradient(#6B4CE6,#6B4CE6) !important;
            }

            .legalText {
                color: #ffffff !important;
                opacity: 1 !important;
            }
        }

        /* Outlook mobile dark-mode hook */
        [data-ogsc] .legalBar {
            background: #6B4CE6 !important;
            background-image: linear-gradient(#6B4CE6,#6B4CE6) !important;
        }

        [data-ogsc] .legalText {
            color: #ffffff !important;
            opacity: 1 !important;
        }

        [data-ogsc] .pageBg {
            background: #0b1220 !important;
        }

        @media (prefers-color-scheme: dark) {
            .pageBg {
                background: #0b1220 !important;
            }

            .belowText {
                color: #cbd5e1 !important;
            }

            .sigMuted {
                color: #94a3b8 !important;
            }

            .sigTitle, .sigLink {
                color: #ffffff !important;
            }
        }
    </style>
</head>

<body class="pageBg" style="margin:0;padding:0;background:#eef1f6;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef1f6;padding:24px 0;">
        <tr>
            <td align="center" style="padding:0 12px;">

                <!-- MAIN BOX -->
                <table role="presentation" width="650" cellspacing="0" cellpadding="0"
                       style="width:650px;max-width:650px;background:#ffffff;border-radius:28px;overflow:hidden;
                      box-shadow:0 10px 26px rgba(17,24,39,.10);">

                    <!-- Header -->
                    <tr>
                        <td align="center"
                            bgcolor="#6B4CE6"
                            style="background:#6B4CE6;background-image:linear-gradient(#6B4CE6,#6B4CE6);
                       padding:22px 18px;">
                            <div style="font-size:34px;font-weight:800;letter-spacing:2px;color:#ffffff;line-height:1;">
                                NETWITCHER
                            </div>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td bgcolor="#FFFFFF"
                            style="background:#FFFFFF;background-image:linear-gradient(#FFFFFF,#FFFFFF);
             padding:30px 34px;">
                            {{{Body}}}
                        </td>
                    </tr>

                    <!-- Stars strip -->
                    <tr>
                        <td bgcolor="#FFFFFF"
                            style="background:#FFFFFF;background-image:linear-gradient(#FFFFFF,#FFFFFF);
                       padding:14px 10px 10px 10px;">
                            <div style="text-align:center;color:#F7D84B;font-size:18px;letter-spacing:4px;line-height:1;">
                                ☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆☆
                            </div>
                        </td>
                    </tr>

                    <!-- ✅ SIGNATURE IMAGE (FIRST) -->
                    <tr>
                        <td bgcolor="#FFFFFF"
                            style="background:#FFFFFF;background-image:linear-gradient(#FFFFFF,#FFFFFF);padding:0;">
                            <img src="{{{FooterSignatureUrl}}}"
                                 width="650"
                                 alt="Netwitcher Signature"
                                 style="display:block;width:100%;max-width:650px;height:auto;border:0;margin:0;" />
                        </td>
                    </tr>

                    <!-- ✅ Footer bar (legal) NOW UNDER THE IMAGE -->
                    <tr>
                        <td class="legalBar"
                            align="center"
                            bgcolor="#6B4CE6"
                            style="background:#6B4CE6;background-image:linear-gradient(#6B4CE6,#6B4CE6);
                       padding:14px 16px;">
                            <div class="legalText" style="font-size:11px;color:#ffffff;">
                                {{LegalLine}}
                            </div>
                        </td>
                    </tr>

                </table>

                <div class="belowText" style="max-width:650px;color:#6b7280;font-size:12px;margin-top:10px;">
                    {{FooterText}}
                </div>

            </td>
        </tr>
    </table>
</body>
</html>
