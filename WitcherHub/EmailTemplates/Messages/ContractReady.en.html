<h2 style="margin:0 0 12px 0;font-size:20px;color:#111827;">
    Hello {{UserName}} 👋
</h2>

<p style="margin:0 0 14px 0;color:#374151;font-size:14px;line-height:1.7;">
    Your contract has been created successfully and is ready for your review and electronic signature.
</p>

<div style="margin:18px 0;">
    <a href="{{{ActionUrl}}}"
       style="display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;">
        View & Sign Contract
    </a>
</div>

<p style="margin:0;color:#6b7280;font-size:12px;line-height:1.6;">
    If the button doesn’t work, copy and paste this link:
    <br />
    <span style="word-break:break-all;">{{{ActionUrl}}}</span>
</p>

<hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0;" />

<p style="margin:0;color:#374151;font-size:13px;line-height:1.7;">
    Contract No: <strong>{{ContractNo}}</strong><br />
    Project: <strong>{{ProjectTitle}}</strong>
</p>
